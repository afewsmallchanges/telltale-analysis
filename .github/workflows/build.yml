# Builds the AppImage, the Flatpak bundle and the Windows installer.

name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  appimage:
    name: AppImage (Linux)
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
   - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates wget file binutils python3-venv python3-pip libpython3.10 \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libglib2.0-0
      - uses: actions/checkout@v6
      - name: Build AppImage
        run: bash packaging/appimage/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage

  flatpak:
    name: Flatpak (Linux)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    steps:
      - uses: actions/checkout@v6
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: telltale-analysis.flatpak
          manifest-path: packaging/flatpak/io.github.afewsmallchanges.TelltaleAnalysis.yml

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Bundle the app with PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          pyinstaller --noconfirm packaging/telltale.spec
      - name: Build the installer with Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" | Select-Object -First 1
          $version = python -c "from importlib.metadata import version; print(version('telltale-analysis'))"
          & $iscc.FullName "/DAppVersion=$version" packaging\windows\telltale.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: dist/*-Setup.exe

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
